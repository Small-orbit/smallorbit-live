name: live
on:
  workflow_dispatch:
permissions:
  actions: write
  contents: read
jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: |
          ( mkdir -p ff && curl -sSL --retry 3 https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-linux64-gpl-8.1.tar.xz | tar -xJ -C ff --strip-components=2 --wildcards '*/bin/ffmpeg' ) &
          pip install -q numpy numba opencv-python-headless pillow chat-downloader
          wait
          echo "FFMPEG=$PWD/ff/ffmpeg" >> $GITHUB_ENV
          ff/ffmpeg -version | head -1
      - name: go live
        env:
          STREAM_KEY: ${{ secrets.YT_STREAM_KEY }}
          GH_TOKEN: ${{ github.token }}
          SECONDS_TO_RUN: "21300"
        run: |
          if [ -z "$STREAM_KEY" ]; then echo "YT_STREAM_KEY secret missing"; exit 1; fi
          ( sleep 20700; gh workflow run live.yml -R ${{ github.repository }} ) &
          bash run_live.sh
