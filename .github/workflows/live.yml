name: live
on:
  workflow_dispatch:
permissions:
  actions: write
  contents: read
jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          (timeout 300 sudo apt-get update -qq; timeout 420 sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends -o DPkg::Lock::Timeout=60 ffmpeg) &
          pip install -q numpy numba opencv-python-headless pillow
          wait
          ffmpeg -version | head -1
      - name: go live
        env:
          STREAM_KEY: ${{ secrets.YT_STREAM_KEY }}
          GH_TOKEN: ${{ github.token }}
          SECONDS_TO_RUN: "21300"
        run: |
          if [ -z "$STREAM_KEY" ]; then echo "YT_STREAM_KEY secret missing"; exit 1; fi
          ( sleep 20700; gh workflow run live.yml -R ${{ github.repository }} ) &
          bash run_live.sh
