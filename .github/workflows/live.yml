name: live
on:
  workflow_dispatch:
permissions:
  actions: write
  contents: read
jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: |
          curl -sL https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz | sudo tar -xJ -C /usr/local/bin --strip-components=1 --wildcards '*/ffmpeg' &
          pip install -q numpy numba opencv-python-headless pillow
          wait
      - name: go live
        env:
          STREAM_KEY: ${{ secrets.YT_STREAM_KEY }}
          GH_TOKEN: ${{ github.token }}
          SECONDS_TO_RUN: "21300"
        run: |
          if [ -z "$STREAM_KEY" ]; then echo "YT_STREAM_KEY secret missing"; exit 1; fi
          if [ $(( ${{ github.run_number }} % 2 )) -eq 0 ]; then export INGEST=backup; else export INGEST=primary; fi
          echo "ingest=$INGEST"
          ( sleep 20700; gh workflow run live.yml -R ${{ github.repository }} ) &
          bash run_live.sh
